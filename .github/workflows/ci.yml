name: Checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.32'
          enable-cache: true
      - run: npm ci && npm run build
        working-directory: web
      - run: ./server/mvnw -B -q -f server/pom.xml verify
      - run: uv sync --frozen --python 3.11
      - name: Verify actual Java HTTP and copied Python database compatibility
        run: uv run python -m scripts.verify_java_service --output .local/java-ci.json
      - name: Install browser for the packaged React UI
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify browser workflows against isolated Java service
        run: npm run test:e2e
        working-directory: web
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.32'
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/validate_splits.py data/manifests/kubernetes-pilot.json data/evaluation/pilot-smoke.jsonl
      - name: Replay frozen public corpus and verify candidate provenance
        run: |
          uv run python -m scripts.prepare_corpus replay
          uv run python -m scripts.build_questions --job m2-dev
          uv run python -m scripts.build_questions --job m2-test-a
          uv run python -m scripts.build_questions --job m2-test-b
          uv run python -m scripts.question_dataset --manifest data/manifests/kubernetes-v1.json --questions data/evaluation/m2-dev.jsonl data/evaluation/m2-test-a.jsonl data/evaluation/m2-test-b.jsonl
          uv run python -m scripts.revise_questions --revision data/evaluation/revisions/m2-dev-v1.1.json
          uv run python -m scripts.question_dataset --manifest data/manifests/kubernetes-v1.json --questions data/evaluation/m2-dev-v1.1.jsonl data/evaluation/m2-test-a.jsonl data/evaluation/m2-test-b.jsonl
      - name: Replay frozen retrieval results and candidate diagnostics without models
        run: |
          uv run python -m scripts.analyze_candidates --output .local/candidate-diagnostics-ci.json
          uv run python -m scripts.evaluate_candidates --candidate-only --output .local/candidate-selection-ci.json
      - name: Replay train-only pilot and independent AI review receipts without models
        run: |
          uv run python -m scripts.prepare_training author-pack --inventory data/training/m4-inventory-v3.json --partition fit --selection data/training/generation/selection-v1.json --output .local/m4-author-fit-v3.json
          uv run python -m scripts.prepare_training author-pack --inventory data/training/m4-inventory-v3.json --partition calibration --selection data/training/generation/selection-v1.json --output .local/m4-author-calibration-v3.json
          uv run python -m scripts.prepare_training replay --inventory data/training/m4-inventory-v3.json --author-packs .local/m4-author-fit-v3.json .local/m4-author-calibration-v3.json --drafts data/training/generation/m4-fit.draft.jsonl data/training/generation/m4-calibration.draft.jsonl --output-dir data/training/m4-pilot-v1
          uv run python -m scripts.validate_training_reviews --drafts data/training/generation/m4-fit.draft.jsonl data/training/generation/m4-calibration.draft.jsonl --reviews data/training/reviews/m4-fit-semantic-v1.jsonl data/training/reviews/m4-calibration-semantic-v1.jsonl --author-packs .local/m4-author-fit-v3.json .local/m4-author-calibration-v3.json --output data/training/reviews/m4-semantic-report-v1.json --verify
      - name: Replay saved training readiness evidence without model weights or inference
        run: uv run python -m scripts.replay_training_readiness --download-tokenizer-only
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
