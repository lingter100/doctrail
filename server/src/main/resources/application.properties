server.address=127.0.0.1
server.port=8000
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=5308416B
spring.servlet.multipart.file-size-threshold=0B
spring.mvc.log-request-details=false
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
logging.level.org.springframework.web=OFF
logging.level.org.apache.catalina=OFF
logging.level.org.apache.coyote=OFF
logging.level.org.apache.tomcat=OFF
doctrail.db=${DOCTRAIL_DB:var/doctrail-java.sqlite3}
doctrail.secure-cookie=${DOCTRAIL_SECURE_COOKIE:0}
doctrail.web-dist=${DOCTRAIL_WEB_DIST:web/dist}
doctrail.inference-url=${DOCTRAIL_INFERENCE_URL:}
doctrail.inference-token=${DOCTRAIL_INFERENCE_TOKEN:}
doctrail.inference-timeout-ms=120000
doctrail.embedding-profile=${DOCTRAIL_EMBEDDING_PROFILE:base}
